<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animación – Ingeniería</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f6f6;font-family:system-ui,sans-serif}
  .demo{width:min(92vw,640px);padding:24px 0}
</style>
</head>
<body>
<!--
  CÓMO USARLA EN SU SITIO WEB
  1. Copie todo el bloque entre "INICIO" y "FIN" (estilos + SVG + script).
  2. Péguelo donde quiera mostrar la animación (en WordPress/Elementor, use un bloque o widget "HTML personalizado").
  3. Se adapta al ancho del contenedor (máximo 640 px; cámbielo en la regla .ing-anim, propiedad max-width).
  - No necesita imágenes ni librerías externas.
  - Se pausa sola cuando no está en pantalla y respeta la opción "reducir movimiento" del sistema.
-->
<style>body{background:transparent}.demo{width:100%;padding:0}</style><div class="demo">
<!-- ============ INICIO ANIMACIÓN INGENIERÍA (copiar desde aquí) ============ -->
<style>
/* Paleta (cámbiela aquí) */
.ing-anim{
  --ing-pri:#b21f24;       /* rojo CFIA */
  --ing-pri-dark:#872026;  /* rojo oscuro */
  --ing-sec:#fcb429;       /* amarillo */
  --ing-sec-soft:#fde3a6;  /* amarillo suave */
  --ing-ink:#231f20;       /* tinta / contornos */
  --ing-dark:#464345;      /* gris oscuro */
  --ing-mute:#bababc;      /* gris claro */
  --ing-casco:#fcb429;     /* casco */
  --ing-casco-franja:#fde3a6; /* franja central del casco */
  --ing-lentes:#464345;    /* lentes */
  width:100%;max-width:640px;margin:0 auto}
.ing-anim svg{display:block;width:100%;height:auto;overflow:visible}

/* Entrada */
.ing-anim .ing-pop{transform-box:fill-box;transform-origin:center;animation:ing-pop .8s cubic-bezier(.34,1.56,.64,1) var(--d,0s) both}
.ing-anim .ing-in{animation:ing-fade .8s ease var(--d,0s) both}
@keyframes ing-pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes ing-fade{from{opacity:0}to{opacity:1}}

/* Movimiento continuo */
.ing-anim .ing-float{animation:ing-float 5s ease-in-out var(--f,0s) infinite}
@keyframes ing-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.ing-anim .ing-breath{animation:ing-breath 4s ease-in-out infinite}
@keyframes ing-breath{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.ing-anim .ing-spin{transform-box:fill-box;transform-origin:center;animation:ing-spin var(--t,8s) linear infinite}
.ing-anim .ing-spin.rev{animation-direction:reverse}
@keyframes ing-spin{to{transform:rotate(360deg)}}

.ing-anim .ing-ring{transform-box:fill-box;transform-origin:center;animation:ing-fade .8s ease var(--d,0s) both,ing-spin var(--t,20s) linear infinite}

.ing-anim .ing-pulse{transform-box:fill-box;transform-origin:center;animation:ing-fade .8s ease var(--d,0s) both,ing-pulse 3.5s ease-in-out var(--p,0s) infinite}
@keyframes ing-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.ing-anim .ing-flow{animation:ing-flow .9s linear infinite}
@keyframes ing-flow{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}

.ing-anim .ing-blink{animation:ing-blink 2.4s ease-in-out var(--b,0s) infinite}
@keyframes ing-blink{0%,100%{opacity:1}50%{opacity:.25}}

/* Grúa */
.ing-anim .ing-swing{transform-origin:0 0;animation:ing-swing 3.2s ease-in-out infinite}
@keyframes ing-swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

/* Gráfico */
.ing-anim .ing-bar{transform-box:fill-box;transform-origin:50% 100%;animation:ing-bar 2.6s ease-in-out var(--b,0s) infinite}
@keyframes ing-bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.ing-anim .ing-chart{stroke-dasharray:100;animation:ing-draw 6s linear infinite}
@keyframes ing-draw{0%{stroke-dashoffset:100;opacity:1}50%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}

/* Compás */
.ing-anim .ing-leg-l{transform-origin:0 0;animation:ing-leg-l 3s ease-in-out infinite}
.ing-anim .ing-leg-r{transform-origin:0 0;animation:ing-leg-r 3s ease-in-out infinite}
@keyframes ing-leg-l{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
@keyframes ing-leg-r{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}

/* Casa */
.ing-anim .ing-smoke{opacity:0;transform-box:fill-box;transform-origin:center;animation:ing-smoke 3.3s ease-out var(--s,0s) infinite}
@keyframes ing-smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.95}100%{opacity:0;transform:translate(7px,-26px) scale(1.5)}}
.ing-anim .ing-window{animation:ing-window 7s ease-in-out var(--w,0s) infinite}
@keyframes ing-window{0%,40%,100%{fill:var(--ing-sec-soft)}50%,90%{fill:var(--ing-sec)}}
.ing-anim .ing-garage{transform-box:fill-box;transform-origin:50% 0;animation:ing-garage 8s ease-in-out infinite}
@keyframes ing-garage{0%,15%,100%{transform:scaleY(1)}35%,70%{transform:scaleY(.2)}}

/* Plano y medidas */
.ing-anim .ing-ants{animation:ing-ants 1.2s linear infinite}
@keyframes ing-ants{to{stroke-dashoffset:-12}}
.ing-anim .ing-plan,.ing-anim .ing-plan2{stroke-dasharray:100;animation:ing-draw 7s linear infinite}
.ing-anim .ing-plan2{animation-delay:-2.5s}
.ing-anim .ing-mv{transform-box:fill-box;transform-origin:center;animation:ing-mv 4s ease-in-out infinite}
.ing-anim .ing-mh{transform-box:fill-box;transform-origin:center;animation:ing-mh 4s ease-in-out -2s infinite}
@keyframes ing-mv{0%,100%{transform:scaleY(.2)}35%,75%{transform:scaleY(1)}}
@keyframes ing-mh{0%,100%{transform:scaleX(.2)}35%,75%{transform:scaleX(1)}}

/* Cursor */
.ing-anim .ing-cursor{animation:ing-cursor 6s ease-in-out infinite}
@keyframes ing-cursor{0%,100%{transform:translate(0,0)}25%{transform:translate(-16px,-14px)}50%{transform:translate(8px,-18px)}75%{transform:translate(-6px,2px)}}

/* Casco, lápiz y regla */
.ing-anim .ing-rock{transform-box:fill-box;transform-origin:50% 100%;animation:ing-rock 3.6s ease-in-out infinite}
@keyframes ing-rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.ing-anim .ing-wiggle{transform-box:fill-box;transform-origin:center;animation:ing-wiggle 2.8s ease-in-out infinite}
@keyframes ing-wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.ing-anim .ing-line{stroke-dasharray:100;animation:ing-line 5s linear infinite}
.ing-anim .ing-pencil{animation:ing-pencil 5s linear infinite}
@keyframes ing-line{0%{stroke-dashoffset:100;opacity:1}55%{stroke-dashoffset:0}80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes ing-pencil{0%{transform:translateX(0)}55%,80%{transform:translateX(60px)}100%{transform:translateX(0)}}

/* Brillos */
.ing-anim .ing-shine{animation:ing-blink 3s ease-in-out infinite}
.ing-anim .ing-glint{transform-box:fill-box;transform-origin:center;transform:skewX(-20deg);animation:ing-glint 4.5s ease-in-out 1.5s infinite}
@keyframes ing-glint{0%,55%{transform:translateX(0) skewX(-20deg)}80%,100%{transform:translateX(96px) skewX(-20deg)}}
@keyframes ing-dot0{0%{transform:scale(0)}4%{transform:scale(1.35)}7%,85%{transform:scale(1)}100%{transform:scale(0)}}
.ing-anim .ing-dot0{transform-box:fill-box;transform-origin:center;animation:ing-dot0 6s linear infinite}
@keyframes ing-dot1{0%,15.5%{transform:scale(0)}19.5%{transform:scale(1.35)}22.5%,85%{transform:scale(1)}100%{transform:scale(0)}}
.ing-anim .ing-dot1{transform-box:fill-box;transform-origin:center;animation:ing-dot1 6s linear infinite}
@keyframes ing-dot2{0%,30.5%{transform:scale(0)}34.5%{transform:scale(1.35)}37.5%,85%{transform:scale(1)}100%{transform:scale(0)}}
.ing-anim .ing-dot2{transform-box:fill-box;transform-origin:center;animation:ing-dot2 6s linear infinite}
@keyframes ing-dot3{0%,50%{transform:scale(0)}54%{transform:scale(1.35)}57%,85%{transform:scale(1)}100%{transform:scale(0)}}
.ing-anim .ing-dot3{transform-box:fill-box;transform-origin:center;animation:ing-dot3 6s linear infinite}

/* Pausa fuera de pantalla y accesibilidad */
.ing-anim.ing-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.ing-anim *{animation:none!important}.ing-anim .ing-smoke{opacity:0}}
</style>
